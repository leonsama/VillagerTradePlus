name: VillagerTradePlus
version: '${version}'
main: dev.villagertradeplus.VillagerTradePlus
api-version: '26.3'
description: Preview future trades and press F to reroll in the vanilla trading screen.
website: https://github.com/leonsama/VillagerTradePlus
authors: [leonsama]
commands:
  villagertradeplus:
    aliases: [tradeplus]
    description: VillagerTradePlus help and config reload
    usage: /villagertradeplus [reload]
permissions:
  villagertradeplus.use:
    default: true
  villagertradeplus.cycle:
    default: true
  villagertradeplus.admin:
    default: op
