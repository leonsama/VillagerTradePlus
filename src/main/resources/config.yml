features:
  reroll:
    # 关闭后不接管双击 F；村民的正常交易不受影响。
    enabled: true
  preview:
    # 关闭后不显示未来交易；已保存的交易计划仍会在升级时兑现。
    enabled: true

# 作者为了满足一点点虚荣心，偷偷加了个加载计数器 QAQ
# 每次成功启用插件，异步访问一次固定的 Moe Counter 链接；不会在重载配置时重复计数。
# 插件不采集或附带设备信息、玩家数据、服务器地址、UUID 或其他标识。
# 计数服务仍可看到网络请求的来源 IP；服务方的日志策略由其自行管理。
# 保持开启会让作者很开心 (〃'▽'〃)，不喜欢就设为 false，完全不影响交易功能！
launch-counter:
  enabled: true

# F 指“交换副手”绑定动作。仅在交易界面的物品格上快速按两次触发。
double-press-millis: 350
cycle-cooldown-millis: 500
# 最大操作距离（方块）。
interaction-distance: 6.0
