features:
  reroll:
    # When disabled, F keeps its vanilla behavior.
    enabled: true
  preview:
    # Hide future trades when disabled; saved plans are still applied on level-up.
    enabled: true

# Sends one request to Moe Counter (https://count.getloli.com/@TradePlus-launch) on each startup, with no personal or device information included. Keeping it enabled makes the author happy (〃'▽'〃)!
launch-counter:
  enabled: true

# Player prompts follow client language: Chinese for zh clients, English otherwise.
# Console output is always English. F means the player's swap-offhand binding.
# Hover over an item slot in the trade screen to reroll.
# false: press F once; true: double-tap F.
double-press-enabled: false
# Maximum time between presses in double-tap mode only (milliseconds).
double-press-millis: 350
# Minimum time between successful rerolls of the same villager (milliseconds).
cycle-cooldown-millis: 400
# Maximum interaction distance in blocks.
interaction-distance: 6.0
